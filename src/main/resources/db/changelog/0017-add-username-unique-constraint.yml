databaseChangeLog:
  - changeSet:
      id: 17
      author: kennywu
      preConditions:
        - onFail: MARK_RAN
        - not:
            - uniqueConstraintExists:
                tableName: "user"
                constraintName: "user_username_key"
      changes:
        - addUniqueConstraint:
            tableName: "user"
            columnNames: "username"
            constraintName: "user_username_key"