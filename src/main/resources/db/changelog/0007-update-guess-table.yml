databaseChangeLog:
  - changeSet:
      id: 7
      author: KENNY
      preConditions:
        - onFail:
        - tableExists:
            tableName: guess
        - not:
            columnExists:
              tableName: guess
              columnName: round_id
        - not:
            columnExists:
              tableName: guess
              columnName: points
      changes:
        - addColumn:
            tableName: "guess"
            columns:
              - column:
                  name: round_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_guess_round
                    references: "round(id)"
              - column:
                  name: points
                  type: int
                  constraints:
                    nullable: false
  - changeSet:
      id: 7-2
      author: LEANNE
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: guess
        - columnExists:
            tableName: guess
            columnName: building_id
      changes:
        - dropForeignKeyConstraint:
            baseTableName: guess
            constraintName: fk_guess_building
        - dropColumn:
            tableName: guess
            columnName: building_id
        - addColumn:
            tableName: guess
            columns:
              - column:
                  name: building
                  type: varchar(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: 7-3
      author: LEANNE
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: guess
        - columnExists:
            tableName: guess
            columnName: floor
      changes:
        - dropColumn:
            tableName: guess
            columnName: floor
        - addColumn:
            tableName: guess
            columns:
              - column:
                  name: floor
                  type: varchar(31)
                  constraints:
                    nullable: false

