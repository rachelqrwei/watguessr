app:
  name: WatGuessr

server:
  port: 8080
  # Tell Spring Boot to trust proxy headers from DigitalOcean
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Connection pooling to prevent database connection exhaustion.
    # minimum-idle must stay 0 so the pool fully drains when traffic stops:
    # Neon only scales to zero after 5 minutes with no connections, and a
    # non-zero minimum-idle makes Hikari reopen connections every max-lifetime.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 20000
      idle-timeout: 60000
      max-lifetime: 1200000
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true
      hibernate.default_schema: watguessr

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
    contexts: default
    default-schema: watguessr
    liquibase-schema: watguessr

aws:
  region: ${AWS_REGION:us-east-2}
  s3:
    bucket:
      name: ${AWS_S3_BUCKET_NAME:watguessr}
  profile: ${AWS_PROFILE:watguessr-s3}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:5173} # for final redirect
