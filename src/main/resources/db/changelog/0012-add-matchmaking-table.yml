# 0011-create-matchmaking-queue-table.yml
databaseChangeLog:
  - changeSet:
      id: 12-1
      author: STANLEY
      changes:
        - createTable:
            tableName: matchmaking_queue
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_matchmaking_queue_user
                    references: user(id)
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false